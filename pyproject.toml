[project]
name = "evidence-agent"
version = "0.1.0"
description = "Citation-backed research agent with an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "tavily-python>=0.5",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.36",
]
dev = [
    "evidence-agent[ui]",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
evidence-agent = "evidence_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["network: hits the real network, deselect with -m 'not network'"]

[tool.ruff]
line-length = 100
